[tool.poetry]
name = "fitsview"
version = "0.1.0"
description = "Just a Fits View app"
authors = ["Marek Gorski <mgorski@camk.edu.pl>"]
license = "MIT"
readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
matplotlib = "^3.6.3"
astropy = ">=6.0"
pyqt6 = ">=6.7"            # jak TOI; import przez fitsview/PyQtX (bez PyQt6 - PyQt5)
scipy = "^1.11"
numpy = ">=1.24.1"
pyaraucaria = { path = "./../pyaraucaria", develop = true }


[tool.poetry.scripts]
FitsView = "fitsview.fitsview:main"
fv = "fitsview.fitsview:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
